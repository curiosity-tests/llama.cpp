name: CI (cpu)

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
    - master
    paths: ['.github/workflows/build-cpu.yml', '.github/workflows/build-cmake-pkg.yml', '**/CMakeLists.txt', '**/.cmake', '**/*.h', '**/*.hpp', '**/*.c', '**/*.cpp']

  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/build-cpu.yml', '.github/workflows/build-cmake-pkg.yml', 'ggml/src/ggml-rpc/**', '**/CMakeLists.txt', '**/.cmake', '**/*.h', '**/*.hpp', '**/*.c', '**/*.cpp']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

permissions:
  contents: read
  id-token: write

run-name: "CI (cpu) ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build-cmake-pkg:
    uses: ./.github/workflows/build-cmake-pkg.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
        - build: 'x64'
          os: ubuntu-22.04
        - build: 'arm64'
          os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
    - name: Clone
      id: checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: ccache
      uses: ggml-org/ccache-action@v1.2.24
      with:
        key: cpu-${{ matrix.os }}
        save: false

    - name: Build Dependencies
      id: build_depends
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          python3 python3-pip python3-dev python3-wheel \
          libjpeg-dev build-essential libssl-dev \
          git-lfs

    - name: Toolchain workaround (GCC 14)
      if: ${{ contains(matrix.os, 'ubuntu-24.04') }}
      run: |
        sudo apt-get install -y gcc-14 g++-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Python Dependencies
      id: python_depends
      run: |
        export PIP_BREAK_SYSTEM_PACKAGES="1"
        python3 -m pip install --upgrade pip setuptools
        pip3 install ./gguf-py

    - name: ccache-buckets-restore
      uses: ./.github/actions/ccache-buckets
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
      with:
        key: cpu-${{ matrix.os }}
        folder: llama.cpp
        hf_bucket: ggml-org/cache

    - name: Build
      id: cmake_build
      run: |
        cmake -B build \
          -DGGML_NATIVE=OFF \
          -DLLAMA_FATAL_WARNINGS=ON \
          -DGGML_RPC=ON
        time cmake --build build --config Release -j $(nproc)

    - name: ccache-buckets-save
      if: ${{ 'push' == 'push' && github.ref == 'refs/heads/master' }}
      uses: ./.github/actions/ccache-buckets
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN_CACHE_OUTPUT }}
      with:
        key: cpu-${{ matrix.os }}
        folder: llama.cpp
        evict-old-files: 1d
        hf_bucket: ggml-org/cache
        save: true

    - name: Test
      id: cmake_test
      run: |
        cd build
        ctest -L main --verbose --timeout 900

    - name: Test llama2c conversion
      id: llama2c_test
      run: |
        cd build
        echo "Fetch tokenizer"
        wget https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/tok512.bin
        echo "Fetch llama2c model"
        wget https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/stories260K.bin
        ./bin/llama-convert-llama2c-to-ggml --copy-vocab-from-model ./tok512.bin --llama2c-model stories260K.bin --llama2c-output-model stories260K.gguf
        ./bin/llama-completion -m stories260K.gguf -p "One day, Lily met a Shoggoth" -n 500 -c 256

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
