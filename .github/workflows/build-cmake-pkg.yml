name: Build relocatable cmake package
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 0
    - name: Build
      run: |
        PREFIX="$(pwd)"/inst
        cmake -S . -B build \
              -DCMAKE_PREFIX_PATH="$PREFIX" \
              -DLLAMA_OPENSSL=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_TOOLS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_APP=OFF \
              -DLLAMA_BUILD_IS_DEV=OFF \
              -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release -j $(nproc)
        cmake --install build --prefix "$PREFIX" --config Release

        export LLAMA_CONFIG="$PREFIX"/lib/cmake/llama/llama-config.cmake
        build_commit=$(git rev-parse --short HEAD | xargs)
        build_number=$(git rev-list --count HEAD | xargs)

        major=$(grep -oE "set\(LLAMA_VERSION_MAJOR[[:space:]]+[0-9]+" CMakeLists.txt | grep -oE "[0-9]+$")
        minor=$(grep -oE "set\(LLAMA_VERSION_MINOR[[:space:]]+[0-9]+" CMakeLists.txt | grep -oE "[0-9]+$")
        patch=$(grep -oE "set\(LLAMA_VERSION_PATCH[[:space:]]+[0-9]+" CMakeLists.txt | grep -oE "[0-9]+$")
        build_version="$major.$minor.$patch"

        checks=("set\(LLAMA_VERSION[[:space:]]+$build_version\)"
                "set\(LLAMA_BUILD_COMMIT[[:space:]]+$build_commit\)"
                "set\(LLAMA_BUILD_NUMBER[[:space:]]+$build_number\)")

        for check in "${checks[@]}"; do
            if ! grep -qE "$check" "$LLAMA_CONFIG"; then
                echo "Checking llama-config.cmake version... \"$check\" failed!"
                exit 1
            fi
        done

        echo "Checking llama-config.cmake version... success."

        cd examples/simple-cmake-pkg
        cmake -S . -B build -DCMAKE_PREFIX_PATH="$PREFIX"/lib/cmake
        cmake --build build -j $(nproc)
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
